# 统一的 controller_manager 配置(由 clearpath generic/gazebo.urdf.xacro 的
# libign_ros2_control-system.so 插件加载,经 my_robot xacro 的 gazebo_controllers arg 指向本文件)
#
# 覆盖:底座 diff_drive(Dingo dd100)+ 机械臂 joint_trajectory + 夹爪 gripper,
#       全部由单个 /controller_manager 管理

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    platform_velocity_controller:
      type: diff_drive_controller/DiffDriveController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

# ---------------- 底座:diff_drive(Dingo dd100) ----------------
# 参数与 clearpath_control/config/dd100/control.yaml 保持一致
platform_velocity_controller:
  ros__parameters:
    use_sim_time: true

    left_wheel_names: [ "front_left_wheel_joint" ]
    right_wheel_names: [ "front_right_wheel_joint" ]

    wheel_separation: 0.37559
    wheels_per_side: 1
    wheel_radius: 0.049

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true   # Nav2 需要 odom -> base_link TF
    tf_frame_prefix_enable: false

    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    preserve_turning_radius: true
    publish_cmd: true
    publish_wheel_data: true

    # 限速(与 dd100 一致)
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 1.3
    linear.x.min_velocity: -1.3
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 4.0
    angular.z.min_velocity: -4.0
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.0

# ---------------- 机械臂:joint_trajectory ----------------
joint_trajectory_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - arm_joint_1
      - arm_joint_2
      - arm_joint_3
      - arm_joint_4
      - arm_joint_5
      - arm_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

# ---------------- 夹爪:gripper ----------------
robotiq_gripper_controller:
  ros__parameters:
    use_sim_time: true
    joint: arm_robotiq_85_left_knuckle_joint
    allow_stalling: true

# ---------------- IMU:imu_sensor_broadcaster ----------------
# 读取 gz_ros2_control 暴露的 imu_0 传感器接口
imu_sensor_broadcaster:
  ros__parameters:
    use_sim_time: true
    sensor_name: imu_0
    frame_id: imu_0_link
